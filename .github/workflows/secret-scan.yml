# SPDX-License-Identifier: MIT
# Secret and PII scan — runs on every pull request.
# Uses project-local .gitleaks.toml (built in T1) for custom PII rules.

name: secret-scan

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
