# 语音转写热词词典
# 用途：
#   1. Paraformer-zh-streaming 的 hotword 参数（空格分隔成 list）
#      作用：ASR 阶段直接 boost 这些词，"流失"→"流式" 这类同音错少
#   2. LLM polish 的 system prompt 注入（按分类分桶）
#      作用：polish 知道"使用体" 大概率是"使用体验"，幻觉成"使用者"概率降低
#
# 维护规则：
#   - 只放高频且容易被错听的词
#   - 太通用的中文常用词（"知道""然后""所以"）不放，否则白名单变噪音
#   - 全部用规范写法（驼峰、连字符），不要全小写

# english_context_terms: Qwen3-ASR transcribe(context=...) 读取。
# 包含全部英文技术词汇（ai_agent + cs_research + software_engineering +
# english_tech_general + user_added 的并集）。
# Qwen3 用作 catch-all union——保证任何 schema 版本（legacy / split / mixed）
# 都不会丢词。
# 注意：此 key 必须排在 paraformer_hotwords 之前，以保证云端供应商
# （Volcano 等）first-100 英文优先的顺序不变（FunASR asr_common 按顺序截取）。
# 命名说明：key 名使用纯 [a-z_] 字符，以便 asr_common.load_hotwords_terms
# 的文本解析器（regex ^[a-z_]+:\s*$）能识别此节，维持 Volcano first-100 英文优先。
