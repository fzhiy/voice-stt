  # 用户通过 /add-hotword 添加的术语（人审已通过的高精度信号，跟 LLM 候选学习路径独立）

# Snippets: 文本里出现 key 自动展开成 value (词边界 \b + case-insensitive).
# 例如说话"my email"被 ASR 转成 "my-email", 经 snippet 展开成真邮箱.
# 慎用: 跟 hotwords / post-correct 同 namespace 容易冲突, 测试后再加.
# snippets:
#   my-email: "you@example.com"
#   my-github: "github.com/yourname"

# Mappings: final-text 替换层. key (LHS) 在 final 文本里出现就被替换为 value (RHS).
# - 仅作用于 final, 不作用于 partial (避免 partial 一闪一变让用户分神).
# - LHS 大小写不敏感; RHS 大小写保留; 多 mapping 时长 LHS 优先, 避免子串吞并.
# - ASCII LHS 用 \b 词边界保护; 含 CJK 的 LHS 走子串替换 (CJK 之间没 \b).
# - 推荐用脚本/agent 维护 (用五条白名单过滤规则把关: 短词/常用词/Levenshtein
#   过大/恒等替换 -> 丢弃, 避免污染常用对话). 直接手写也完全 OK.
# - LHS 含空格 / 标点的务必用引号包起来, 防 yaml 解析歧义.
# 例:
# mappings:
#   "cloud code": "Claude Code"
#   "ghosty": "Ghostty"
#   "should also S": "Shift+Alt+S"
mappings:
  "沙贝 agent": "subagent"
  "萨贝 agent": "subagent"
  "撒贝 agent": "subagent"
  "四大杯间的": "subagent"
  "四大杯间": "subagent"
  # Scriptable (iOS widget/scripting app) — Qwen3-ASR has heard it as "scribble"
  # (Apple Pencil handwriting feature) when language="Chinese" is locked.
  "scribble": "Scriptable"
